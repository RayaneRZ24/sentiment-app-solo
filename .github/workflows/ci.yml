name: Verification solo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tp-solo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Environnement et dependances
        run: python -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt
      - name: Diagnostic solo
        run: . .venv/bin/activate && python scripts/check_setup.py
      - name: Tests
        run: . .venv/bin/activate && python -m pytest -q
