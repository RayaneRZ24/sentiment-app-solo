name: Verification solo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tp-solo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Environnement et dependances
        run: python -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt -r requirements-dev.txt
      - name: Installation editable du paquet
        run: . .venv/bin/activate && pip install -e ".[ui]"
      - name: Diagnostic solo
        run: . .venv/bin/activate && python scripts/check_setup.py
      - name: Modele de demonstration
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - name: Ruff
        run: . .venv/bin/activate && ruff check .
      - name: Mypy
        run: . .venv/bin/activate && mypy api
      - name: Tests et couverture API
        run: . .venv/bin/activate && python -m pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95
      - name: Livraison client installee hors du depot
        run: |
          . .venv/bin/activate
          python -m build --wheel
          python scripts/preparer_livraison.py
          python scripts/verifier_livraison.py dist/sentiment-app-client-*.zip --rapport /tmp/rapport-installation-client.json
      - name: Application installable et preuve de verification
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-app-client
          path: |
            dist/sentiment-app-client-*.zip
            dist/*.whl
            /tmp/rapport-installation-client.json
          if-no-files-found: error
